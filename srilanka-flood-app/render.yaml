services:
  - type: static
    name: srilanka-flood-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
        # IMPORTANT: Set this value in Render dashboard under Environment Variables
        # Example: https://your-backend.onrender.com/api
        # Default (if not set): http://localhost:3000/api

